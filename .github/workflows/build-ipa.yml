name: Build TABI EDIT iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install iOS Cross-Compiler Toolchain (Clang + LLD + ldid + iPhoneOS SDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zip curl xz-utils git
          curl -L https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o ldid
          chmod +x ldid

      - name: Compile Native arm64 iOS App & Package TABI_EDIT.ipa
        run: |
          mkdir -p Payload/TabiEdit.app

          clang -target arm64-apple-ios15.0 \
            -isysroot $(pwd)/iPhoneOS16.5.sdk \
            -fuse-ld=lld \
            -fobjc-arc \
            -O2 \
            TabiEdit/main.m \
            -framework UIKit \
            -framework Foundation \
            -framework WebKit \
            -framework AVFoundation \
            -framework CoreImage \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework Photos \
            -framework CoreGraphics \
            -o Payload/TabiEdit.app/TabiEdit

          ./ldid -S Payload/TabiEdit.app/TabiEdit
          cp TabiEdit/Info.plist Payload/TabiEdit.app/Info.plist
          cp TabiEdit/index.html Payload/TabiEdit.app/index.html
          printf "APPL????" > Payload/TabiEdit.app/PkgInfo

          zip -r9 TABI_EDIT.ipa Payload
          ls -lh TABI_EDIT.ipa

      - name: Upload TABI_EDIT.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TABI_EDIT_IPA
          path: TABI_EDIT.ipa

      - name: Publish GitHub Release with TABI_EDIT.ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TABI EDIT iOS v1.0.${{ github.run_number }} (IPA)"
          body: |
            ### 🎬 TABI EDIT — iOS 1080p 60FPS Video Enhancer & Editor
            - **App Name:** TABI EDIT (`TABI_EDIT.ipa`)
            - **Features Included:**
              - 🔥 **CapCut Default 1 & Default 2** 1-Click Quality Presets + Custom Color & 5-Ch HSL Sliders
              - ✂️ **Video Split & 🗑️ Delete Clip** Timeline Editor
              - ✨ **Fade-In Animation** (Adjustable duration)
              - 🎙️ **Voice Overlay** (Live Microphone Voiceover Recorder + Audio File Import + Volume Mixer)
              - 🚀 **1080p 60FPS Export** to iPhone Photos & Share Sheet
          files: TABI_EDIT.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
