name: TabiEdit
options:
  bundleIdPrefix: com.tabi
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_NAME: TabiEdit
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  TabiEdit:
    type: application
    platform: iOS
    sources:
      - path: TabiEdit
    info:
      path: TabiEdit/Info.plist
      properties:
        CFBundleDisplayName: "TABI EDIT"
        CFBundleName: "TABI EDIT"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "TABI EDIT needs photo library access to import and save your enhanced 1080p 60FPS videos."
        NSPhotoLibraryAddUsageDescription: "TABI EDIT saves your enhanced 1080p 60FPS videos to your Photos library."
        NSMicrophoneUsageDescription: "TABI EDIT uses the microphone so you can record voice overlays on your videos."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
